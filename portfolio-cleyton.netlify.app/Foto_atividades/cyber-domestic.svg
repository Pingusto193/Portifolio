<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <linearGradient id="glowBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Grid lines (circuit board feel) -->
  <g opacity="0.07" stroke="#00b4d8" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="150" y1="0" x2="150" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="450" y1="0" x2="450" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="750" y1="0" x2="750" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1050" y1="0" x2="1050" y2="675"/>
  </g>

  <!-- Glow circles background -->
  <circle cx="600" cy="337" r="260" fill="none" stroke="#00b4d8" stroke-width="1" opacity="0.15"/>
  <circle cx="600" cy="337" r="200" fill="none" stroke="#00b4d8" stroke-width="1" opacity="0.12"/>

  <!-- House outline (circuit style) -->
  <polyline points="600,95 760,210 760,400 440,400 440,210 600,95" fill="none" stroke="#00b4d8" stroke-width="3" opacity="0.6" filter="url(#glow)"/>
  <!-- House door -->
  <rect x="555" y="310" width="90" height="90" rx="4" fill="none" stroke="#00b4d8" stroke-width="2" opacity="0.5"/>

  <!-- Circuit dots on house -->
  <circle cx="600" cy="95" r="6" fill="#00b4d8" filter="url(#glow)" opacity="0.9"/>
  <circle cx="760" cy="210" r="5" fill="#00b4d8" filter="url(#glow)" opacity="0.8"/>
  <circle cx="440" cy="210" r="5" fill="#00b4d8" filter="url(#glow)" opacity="0.8"/>
  <circle cx="760" cy="400" r="5" fill="#00b4d8" opacity="0.6"/>
  <circle cx="440" cy="400" r="5" fill="#00b4d8" opacity="0.6"/>

  <!-- Robot body -->
  <!-- Head -->
  <rect x="545" y="185" width="110" height="85" rx="18" fill="#1a2a3a" stroke="#00b4d8" stroke-width="2" filter="url(#glow)"/>
  <!-- Eyes -->
  <circle cx="575" cy="218" r="14" fill="#001a2a"/>
  <circle cx="575" cy="218" r="9" fill="#00c8ff" filter="url(#glow)"/>
  <circle cx="575" cy="218" r="4" fill="#ffffff"/>
  <circle cx="625" cy="218" r="14" fill="#001a2a"/>
  <circle cx="625" cy="218" r="9" fill="#00c8ff" filter="url(#glow)"/>
  <circle cx="625" cy="218" r="4" fill="#ffffff"/>
  <!-- Antenna -->
  <line x1="600" y1="185" x2="600" y2="160" stroke="#00b4d8" stroke-width="3" filter="url(#glow)"/>
  <circle cx="600" cy="155" r="7" fill="#00b4d8" filter="url(#glow)"/>
  <!-- Mouth indicator -->
  <rect x="572" y="248" width="56" height="8" rx="4" fill="#00b4d8" opacity="0.7"/>

  <!-- Robot torso -->
  <rect x="540" y="278" width="120" height="80" rx="12" fill="#152535" stroke="#00b4d8" stroke-width="2"/>
  <!-- Chest panel -->
  <rect x="560" y="290" width="80" height="28" rx="6" fill="#001a2a" stroke="#00b4d8" stroke-width="1" opacity="0.8"/>
  <rect x="565" y="295" width="22" height="18" rx="3" fill="#00b4d8" opacity="0.6"/>
  <rect x="591" y="295" width="22" height="18" rx="3" fill="#00b4d8" opacity="0.3"/>
  <rect x="617" y="295" width="12" height="18" rx="3" fill="#00b4d8" opacity="0.2"/>

  <!-- Left arm (holding broom) -->
  <rect x="490" y="282" width="42" height="18" rx="9" fill="#152535" stroke="#00b4d8" stroke-width="1.5"/>
  <!-- Broom handle -->
  <line x1="480" y1="298" x2="430" y2="380" stroke="#8B6914" stroke-width="5" stroke-linecap="round"/>
  <!-- Broom head -->
  <ellipse cx="415" cy="388" rx="30" ry="10" fill="#c8a050" opacity="0.9"/>
  <line x1="390" y1="388" x2="440" y2="388" stroke="#a07830" stroke-width="3"/>

  <!-- Right arm (holding tray) -->
  <rect x="668" y="282" width="42" height="18" rx="9" fill="#152535" stroke="#00b4d8" stroke-width="1.5"/>
  <!-- Tray -->
  <ellipse cx="730" cy="285" rx="35" ry="8" fill="#c0c0c0" opacity="0.8"/>
  <rect x="695" y="277" width="70" height="8" rx="2" fill="#a0a0a0" opacity="0.6"/>

  <!-- Legs -->
  <rect x="555" y="358" width="35" height="42" rx="8" fill="#152535" stroke="#00b4d8" stroke-width="1.5"/>
  <rect x="610" y="358" width="35" height="42" rx="8" fill="#152535" stroke="#00b4d8" stroke-width="1.5"/>
  <!-- Feet -->
  <rect x="548" y="392" width="48" height="14" rx="6" fill="#1a3040" stroke="#00b4d8" stroke-width="1"/>
  <rect x="604" y="392" width="48" height="14" rx="6" fill="#1a3040" stroke="#00b4d8" stroke-width="1"/>

  <!-- Floating particles -->
  <circle cx="420" cy="150" r="3" fill="#00b4d8" opacity="0.7" filter="url(#glow)"/>
  <circle cx="460" cy="480" r="2" fill="#00b4d8" opacity="0.5"/>
  <circle cx="780" cy="130" r="4" fill="#00b4d8" opacity="0.6" filter="url(#glow)"/>
  <circle cx="820" cy="460" r="2" fill="#00b4d8" opacity="0.4"/>
  <circle cx="350" cy="320" r="3" fill="#00b4d8" opacity="0.5"/>
  <circle cx="850" cy="300" r="3" fill="#00b4d8" opacity="0.5"/>

  <!-- Brand name -->
  <text x="600" y="488" fill="#00b4d8" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" text-anchor="middle" filter="url(#softGlow)" letter-spacing="2">Cyber_<tspan fill="#ffffff">Domestic</tspan></text>

  <!-- Tagline -->
  <text x="600" y="520" fill="#aaaaaa" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" letter-spacing="5">AUTOMATIZAÇÃO DE SERVIÇOS DOMÉSTICOS</text>

  <!-- Bottom accent line -->
  <rect x="200" y="540" width="800" height="2" rx="1" fill="url(#glowBlue)" opacity="0.6"/>

  <!-- Slogan -->
  <text x="600" y="575" fill="#888888" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" font-style="italic">"Mais tempo para o que importa"</text>

  <!-- Corner circuit decorations -->
  <g opacity="0.3" stroke="#00b4d8" stroke-width="2" fill="none">
    <polyline points="30,30 80,30 80,80"/>
    <circle cx="80" cy="30" r="4" fill="#00b4d8"/>
  </g>
  <g opacity="0.3" stroke="#00b4d8" stroke-width="2" fill="none">
    <polyline points="1170,30 1120,30 1120,80"/>
    <circle cx="1120" cy="30" r="4" fill="#00b4d8"/>
  </g>
  <g opacity="0.3" stroke="#00b4d8" stroke-width="2" fill="none">
    <polyline points="30,645 80,645 80,595"/>
    <circle cx="80" cy="645" r="4" fill="#00b4d8"/>
  </g>
  <g opacity="0.3" stroke="#00b4d8" stroke-width="2" fill="none">
    <polyline points="1170,645 1120,645 1120,595"/>
    <circle cx="1120" cy="645" r="4" fill="#00b4d8"/>
  </g>
</svg>
